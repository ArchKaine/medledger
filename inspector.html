<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedLedger: Vault Inspector</title>
    <link rel="stylesheet" href="newstyle.css">
    <style>
        body {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .inspector-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }
        .json-viewer {
            background-color: #0f172a;
            color: #e2e8f0;
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            max-height: 60vh;
            overflow-y: auto;
        }
        .controls-card {
            background: var(--bg-surface);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body data-theme="dark">
    <div class="inspector-header">
        <h1 style="color: var(--accent-color); display: flex; align-items: center; gap: 0.5rem;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M12 18v-6"></path><path d="M9 15h6"></path></svg>
            Vault Data Inspector
        </h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.5rem;">
            Securely decrypt and view the raw JSON contents of a <code>.medvault</code> backup file. This tool is read-only and will <strong>not</strong> overwrite your active database.
        </p>
    </div>

    <div class="controls-card">
        <div class="form-group" style="margin-bottom: 1rem;">
            <label class="form-label">1. Select Backup File (.medvault)</label>
            <input type="file" id="inspector-file" accept=".medvault,.json" style="width: 100%; padding: 0.5rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary);">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label class="form-label">2. Decryption Password (if applicable)</label>
            <input type="password" id="inspector-password" placeholder="Enter vault password" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-primary); color: var(--text-primary);">
        </div>

        <div class="action-group" style="margin: 0;">
            <button id="btn-inspect" class="btn btn-primary" style="flex: 1;">Decrypt & View Data</button>
            <button onclick="window.close()" class="btn btn-secondary" style="flex: 0 0 auto;">Close Tab</button>
        </div>
        
        <div id="inspector-status" style="margin-top: 1rem; font-size: 0.85rem; font-weight: bold; text-align: center;"></div>
    </div>

    <div id="viewer-container" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <h2 style="margin: 0; font-size: 1rem;">Raw Decrypted Payload</h2>
            <button id="btn-copy" class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.8rem;">Copy JSON</button>
        </div>
        <pre id="json-output" class="json-viewer"></pre>
    </div>

    <script src="inspector.js"></script>
</body>
</html>
