<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#18181b">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MedLedger">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis[...]
    <title>MedLedger</title>
</head>
<body>
    <div class="app-shell">
        <nav class="sidebar-nav" aria-label="Main navigation" style="display: none;">
            <!-- Optional sidebar (hidden by default). Add navigation items here if needed. -->
        </nav>

        <header class="app-header">
            <div class="header-content">
                <h1>MedLedger</h1>
                <div class="header-controls">
                    <div id="status-bar" class="status-indicator">Initializing...</div>
                    
                    <button id="help-toggle" aria-label="Help Guide" class="icon-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </button>

                    <button id="settings-toggle" aria-label="Settings" class="icon-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-1.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06c.5.5 1.18.78 1.82.33.54-.35 1.18-.35 1.82 0 .64.45 1.32.17 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06c-.5.5-.78 1.18-.33 1.82.35.54.35 1.18 0 1.82z"></path>
                        </svg>
                    </button>

                    <button id="theme-toggle" aria-label="Toggle Dark Mode" class="icon-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <main id="app">
            <section id="med-config" class="card">
                <h2>Add Medication</h2>
                <form id="add-med-form">
                    <div class="inline-form" style="margin-bottom: 0.5rem; align-items: flex-start;">
                        <input type="text" id="new-med-name" placeholder="Medication (e.g., Lisinopril)" required style="flex: 1;">
                        <input type="text" id="new-med-dose" placeholder="Dosage (e.g., 10mg)" required style="flex: 1;">
                        <select id="new-med-freq" required style="flex: 1;">
                            <option value="Daily" selected>Daily</option>
                            <option value="Morning">Morning</option>
                            <option value="Night">Night</option>
                            <option value="Weekly">Weekly</option>
                            <option value="As Needed">As Needed (PRN)</option>
                            <option value="Specific Days">Specific Days</option>
                            <option value="Cyclic">Cyclic (On/Off)</option>
                        </select>
                        
                        <div style="display: flex; flex-direction: column; gap: 0.25rem; flex: 1;">
                            <div id="new-med-times-container" style="display: flex; flex-direction: column; gap: 0.25rem;"><!-- time inputs inserted here --></div>
                            <button type="button" onclick="addTimeField('new-med-times-container')" class="btn btn-secondary" style="padding: 0.25rem; font-size: 0.8rem;">+ Add Time</button>
                        </div>
                    </div>

                    <div id="new-med-specific-days" style="display: none; margin-bottom: 0.5rem; flex: 100%;">
                        <label class="form-label" style="font-size: 0.8rem; margin-bottom: 0.25rem; display: block;">Select Days:</label>
                        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; background: var(--bg-primary); padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
                            <label><input type="checkbox" name="new-med-days" value="0"> Sun</label>
                            <label><input type="checkbox" name="new-med-days" value="1"> Mon</label>
                            <label><input type="checkbox" name="new-med-days" value="2"> Tue</label>
                            <label><input type="checkbox" name="new-med-days" value="3"> Wed</label>
                            <label><input type="checkbox" name="new-med-days" value="4"> Thu</label>
                            <label><input type="checkbox" name="new-med-days" value="5"> Fri</label>
                            <label><input type="checkbox" name="new-med-days" value="6"> Sat</label>
                        </div>
                    </div>

                    <div id="new-med-cyclic" style="display: none; margin-bottom: 0.5rem; gap: 0.5rem; flex: 100%;">
                        <div style="flex: 1;">
                            <label class="form-label" style="font-size: 0.8rem;">Days On</label>
                            <input type="number" id="new-med-cycle-on" placeholder="e.g. 21" style="width: 100%; padding: 0.5rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px;">
                        </div>
                        <div style="flex: 1;">
                            <label class="form-label" style="font-size: 0.8rem;">Days Off</label>
                            <input type="number" id="new-med-cycle-off" placeholder="e.g. 7" style="width: 100%; padding: 0.5rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px;">
                        </div>
                        <div style="flex: 1;">
                            <label class="form-label" style="font-size: 0.8rem;">Cycle Start Date</label>
                            <input type="date" id="new-med-cycle-start" style="width: 100%; padding: 0.5rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px;">
                        </div>
                    </div>

                    <div class="inline-form" style="margin-bottom: 0.5rem;">
                        <input type="text" id="new-med-instructions" placeholder="Bottle Instructions (e.g., Take with food)" style="flex: 2;">
                        <input type="text" id="new-med-side-effects" placeholder="Side Effects to Watch" style="flex: 2;">
                        <input type="number" id="new-med-inventory" placeholder="Pill Count" min="0" style="flex: 1; display: none;">
                    </div>
                    <div class="action-group" style="justify-content: flex-end;">
                        <button type="submit" class="btn btn-secondary">Add to Regimen</button>
                    </div>
                </form>
            </section>

            <div class="tab-navigation">
                <button id="tab-today" class="tab-btn active">Today's Regimen</button>
                <button id="tab-history" class="tab-btn">History Log</button>
            </div>

            <section id="daily-schedule" class="card tab-view active-view">
                <form id="med-form">
                    <div id="checklist-container" class="checklist"></div>
                    
                    <div class="datetime-override">
                        <label for="manual-time" class="override-label">Time Taken (Leave blank for 'Now'):</label>
                        <input type="datetime-local" id="manual-time">
                    </div>

                    <div class="action-group">
                        <button type="button" id="btn-submit-selected" class="btn btn-secondary">Log Selected</button>
                        <button type="button" id="btn-submit-all" class="btn btn-primary">Log All Medications</button>
                    </div>
                </form>
            </section>

            <section id="log-history" class="card tab-view hidden-view">
                <div id="adherence-dashboard" style="background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; text-align: left; position: relative;">
                    <h3 style="margin: 0; font-size: 0.9rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">7-Day Adherence</h3>
                    <div id="adherence-score" style="font-size: 2.5rem; font-weight: bold; color: var(--text-primary); margin-top: 0.5rem;">--%</div>
                    <div id="adherence-subtext" style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;">Calculating...</div>
                    
                    <div class="streak-stats" style="position: absolute; right: 1rem; bottom: 1rem; text-align: right; font-size: 0.85rem; color: var(--text-secondary);">
                        <div style="margin-bottom: 0.25rem;">🔥 Current Streak: <strong id="current-streak" style="color: var(--text-primary);">0</strong></div>
                        <div>🏆 Best Streak: <strong id="longest-streak" style="color: var(--text-primary);">0</strong></div>
                    </div>
                </div>

                <div id="heatmap-container" style="background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <h3 style="margin: 0; font-size: 0.9rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Consistency Grid</h3>
                        <select id="heatmap-range" style="width: auto; padding: 0.25rem 0.5rem; font-size: 0.8rem; border-color: var(--border-color);">
                            <option value="7" selected>1 Week</option>
                            <option value="30">1 Month</option>
                            <option value="90">3 Months</option>
                        </select>
                    </div>
                   
                    <div id="heatmap-grid" class="heatmap-grid"></div>
                    
                    <div id="heatmap-details" style="display:none; padding: 1rem; margin-top: 1rem; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem;"></div>

                    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 0.5rem; margin-top: 0.75rem; font-size: 0.75rem; color: var(--text-secondary);">
                        <span>Missed</span>
                        <div class="heatmap-cell level-0" style="width: 12px; height: 12px;"></div>
                        <div class="heatmap-cell level-1" style="width: 12px; height: 12px;"></div>
                        <div class="heatmap-cell level-2" style="width: 12px; height: 12px;"></div>
                        <span>Perfect</span>
                    </div>
                </div>
                
                <div id="analytics-insights" class="insights-grid"></div>            
                
                <ul id="history-list" class="history-feed"></ul>
            </section>
        </main>
    </div>

    <dialog id="help-modal" class="card modal" style="max-height: 85vh; overflow-y: auto; max-width: 600px;">
        <h2>User Guide & Warnings</h2>
        <!-- help content omitted for brevity (unchanged) -->
        <div class="action-group modal-actions" style="margin-top: 2rem; justify-content: space-between; align-items: center;">
            <div style="font-size: 0.8rem; color: var(--text-secondary); display: flex; gap: 1rem;">
                <a href="privacy.html" style="color: var(--accent-color); text-decoration: none;">Privacy Policy</a>
                <a href="terms.html" style="color: var(--accent-color); text-decoration: none;">Terms of Service</a>
            </div>
            <button type="button" id="btn-close-help" class="btn btn-primary">Got it</button>
        </div>
    </dialog>

    <dialog id="edit-med-modal" class="card modal" style="max-height: 90vh; overflow-y: auto;">
        <h2>Edit Medication</h2>
        <form id="edit-med-form" class="edit-form">
            <input type="hidden" id="edit-med-id">
            <!-- edit form contents unchanged -->
            <div class="action-group modal-actions">
                <button type="button" id="btn-cancel-edit" class="btn btn-secondary">Cancel</button>
                <button type="button" id="btn-delete-med" class="btn btn-danger">Delete</button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </dialog>

    <dialog id="settings-modal" class="card modal" style="max-height: 90vh; overflow-y: auto;">
        <!-- settings modal unchanged -->
    </dialog>

    <script src="app.js"></script>
    <script src="engine.js"></script>
    <script src="clinical.js"></script>
    <script src="help.js"></script>
    <script src="ui.js"></script>
    <script src="vault.js"></script>
    <script src="analytics.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSync()"></script>
</body>
</html>
